name: Notepad Ultra macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: "6.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            cmake_arch: arm64
            deployment_target: "13.0"
          - os: macos-15-intel
            arch: x64
            cmake_arch: x86_64
            deployment_target: "12.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DAPP_DISTRIBUTION=dmg
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build dmg
        run: cmake --build build --target dmg --parallel

      - name: Rename dmg
        run: |
          for f in build/NotepadUltra-v*.dmg; do
            mv "$f" "${f%.dmg}-macOS-${{ matrix.arch }}.dmg"
          done

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: NotepadUltra-macOS-${{ matrix.arch }}
          path: build/NotepadUltra-v*.dmg

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Notepad Ultra is a fork of [Notepad Next](https://github.com/dail8859/NotepadNext) with a dark mode and a macOS startup fix.

          ## Highlights
          - Dark mode: *Preferences > Appearance* switches between System, Light and Dark, applied live.
          - Fix for text drawn at twice the size on a non-Retina monitor after startup.
          - New name and icon.
          - Tabs show their close button again, and the tab titles stay readable after switching the color scheme at runtime.
          - The Help menu shows the version.
          - The macOS application menu is translated (Qt translations are bundled).
          - The Debug Info menu entry is gone.

          ## Install (macOS)
          Download the DMG for your Mac (`arm64` for Apple Silicon, `x64` for Intel), open it and drag the app to Applications. The app is not notarized by Apple, so on first start right click the app and choose Open.
          NOTES

      - name: Create release
        run: >
          gh release create ${{ github.ref_name }} NotepadUltra-v*.dmg
          --repo ${{ github.repository }}
          --title "Notepad Ultra ${{ github.ref_name }}"
          --notes-file release-notes.md
